name: Site

# Builds pavebench.org from site/ and results/leaderboard.json and publishes it
# to GitHub Pages. The custom domain comes from the CNAME file the build writes.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "results/leaderboard.json"
      - "pavebench/**"
      - "dataset/v0/cases/pb_us_il_justice_testa_001/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m pavebench.cli build-site --results results/leaderboard.json --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
